name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: |
          mkdir -p .pages
          cp index.html logo.svg favicon.svg favicon.png robots.txt sitemap.xml llms.txt README.md README.id.md THIRD_PARTY_NOTICES.md manifest.webmanifest sela-sw.js .pages/
          cp -r site dist example .pages/
          touch .pages/.nojekyll
      - name: Direct active readers to Sela
        run: |
          cat > .pages/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sela — a place between, a story within</title><link rel="canonical" href="https://bobbyfch.github.io/sela/"><meta http-equiv="refresh" content="0;url=https://bobbyfch.github.io/sela/"><body><h1>Sela</h1><p>Our reading room has moved. <a href="https://bobbyfch.github.io/sela/">Open Sela 1.0</a>.</p><script>location.replace('https://bobbyfch.github.io/sela/'+location.search+location.hash);</script></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - uses: actions/deploy-pages@v4
        id: deployment
