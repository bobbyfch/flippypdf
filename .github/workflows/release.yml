name: Publish v2 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create release tag without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v2.0.0; then
            echo 'Release tag already exists; do not overwrite it.'
          else
            git tag v2.0.0 "$GITHUB_SHA"
            git push origin refs/tags/v2.0.0
          fi
          if ! gh release view v2.0.0 >/dev/null 2>&1; then
            gh release create v2.0.0 --verify-tag --title 'FlippyPDF 2.0.0' --notes-file CHANGELOG.md
          fi
      - name: Remove the temporary snapshot branch only if it is unchanged
        run: |
          expected=cc82f74827830317ed8c5ab983e450e2ce9c3cf4
          actual=$(git ls-remote --heads origin refs/heads/v2.0.0 | cut -f1)
          if [ "$actual" = "$expected" ]; then
            git push --force-with-lease="refs/heads/v2.0.0:$expected" origin :refs/heads/v2.0.0
          fi
